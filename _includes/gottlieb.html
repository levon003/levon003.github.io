     Generator: files/gottlieb/gottlieb.js (renderGottlieb(canvas, seed)). Seed is kept in the URL hash.
     Taps: the sun flicks through variants; the dark mass steps straight to the next one; any other tap ripples the paint. -->

    -webkit-tap-highlight-color: transparent; }
  .gt-touch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

<script>
(function () {
  const main = document.getElementById("gt-main"), mctx = main.getContext("2d", { willReadFrequently: true });
  const seedEl = document.getElementById("gt-seed");
  if (matchMedia("(pointer: coarse)").matches) document.querySelector("#gt-widget .gt-verb").textContent = "tapping";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const randSeed = () => Math.floor(Math.random() * 1e6);
  let geom = null, flicking = false;

  // Pool of pre-rendered variants, refilled one at a time in idle moments (a full render is ~100 ms).
  // Phones and small machines (a render can take 300-600 ms there) keep a smaller stock of ready variants.
  const LOW = matchMedia("(pointer: coarse)").matches || (navigator.hardwareConcurrency || 8) <= 4;
  const POOL = LOW ? 5 : 8, KEEP = LOW ? 4 : 6, pool = [];
  // canvases no longer shown are reused for new renders rather than left for the garbage collector (iOS caps canvas memory)
  const spare = [];
  const retire = (v) => { if (v && spare.length < 4) spare.push(v.canvas); };
  const idle = window.requestIdleCallback || ((f) => setTimeout(f, 50));
  function renderOff(seed) {
    const c = spare.pop() || document.createElement("canvas");
    c.width = main.width; c.height = main.height; // (re)sizing also clears
    const g = renderGottlieb(c, seed);
    return { seed, canvas: c, geom: g };
  }
  // A render blocks the main thread, so it must not run while something is animating: rAF gaps count as "idle", and
  // refilling right after a flick otherwise stutters focus mode's rings and the touch ripples. main.gtBusy is set by focus mode.
  function refill() {
    if (pool.length >= POOL) return;
    idle(() => {
      if (flicking || (main.gtBusy && main.gtBusy()) || ripples.length) { setTimeout(refill, 250); return; }
      pool.push(renderOff(randSeed())); refill();
    });
  }

  // The seed goes into the URL only once the reader has changed the painting themselves, and never over another
  // fragment (a link to a heading must still scroll there; copied URLs shouldn't pin a seed nobody chose).
  let userActed = false, io = null;
  function acted() { userActed = true; if (io) { io.disconnect(); io = null; } }
  main.gtActed = acted; // focus mode calls this when it opens
  let shown = null;
  function land(v) {
    if (shown && shown !== v && !seen.includes(shown)) retire(shown);
    shown = v;
    geom = v.geom;
    mctx.drawImage(v.canvas, 0, 0);
    main.dataset.seed = v.seed;
    main.dispatchEvent(new CustomEvent("gt:land", { detail: { seed: v.seed } }));
    seedEl.textContent = "seed " + v.seed; seedEl.setAttribute("aria-label", `seed ${v.seed}, copy a link`);
    if (userActed && (!location.hash || /^#seed=\d+$/.test(location.hash))) history.replaceState(null, "", "#seed=" + v.seed);
  }

  // Flick through pooled variants with a slot-machine ease-out, then land on the last one, which is always new.
  // A flick empties the pool and refilling takes a second or two, so for quick repeat taps the in-between frames are
  // topped up from recent flicks' frames: each is on screen for well under a third of a second, so repeats go unnoticed.
  const FLICK = 8, seen = [];
  function flick() {
    if (flicking) return;
    if (reduceMotion) { land(pool.shift() || renderOff(randSeed())); refill(); return; }
    const fresh = pool.splice(0, pool.length), last = fresh.pop() || renderOff(randSeed());
    const filler = seen.filter((v) => v.seed !== +main.dataset.seed).sort(() => Math.random() - 0.5);
    const between = fresh.concat(filler).slice(0, FLICK - 1);
    seen.push(...fresh); seen.splice(0, Math.max(0, seen.length - KEEP)).forEach(retire); // keep the newest few (~3 MB each)
    if (between.length < 2) { land(last); refill(); return; } // the very first taps, before anything has been seen
    flicking = true;
    const frames = between.concat([last]);
    const delays = frames.map((_, i) => 55 + 230 * Math.pow(i / (frames.length - 1), 2.2));
    let i = 0;
    (function step() {
      if (i === frames.length - 1) { land(frames[i]); flicking = false; refill(); return; }
      mctx.drawImage(frames[i].canvas, 0, 0);
      main.dispatchEvent(new Event("gt:frame"));
      setTimeout(step, delays[i++]);
    })();
  }
  function show(seed) { land(renderOff(seed)); }

  // Hit tests, with x, y as fractions of the painting. The disc's radii are fractions of width (rx) and height (ry).
  main.gtOverDisc = (x, y) => !!geom && Math.pow((x - geom.red.x) / geom.red.rx, 2) + Math.pow((y - geom.red.y) / geom.red.ry, 2) <= 1.1;
  // the dark mass: anywhere in the lower part, or a dark pixel (its towers reach up)
  main.gtOverDark = (x, y) => {
    if (y > 0.45) return true;
    const d = mctx.getImageData(Math.round(x * main.width) - 3, Math.round(y * main.height) - 3, 7, 7).data;
    let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] + d[i + 1] + d[i + 2];
    return s / 49 < 120;
  };
  main.gtGeom = () => geom;
  // Step straight to the next variant, no flick.
  main.gtStep = () => { if (flicking) return; acted(); land(pool.shift() || renderOff(randSeed())); refill(); };
  const userFlick = () => { acted(); flick(); };

  // ---------- touch ripples: a tap disturbs the paint, like a drop on a wet surface ----------
  // Three thin, wobbly rings run out from the tap and fade, each drawn as a dark trough beside a light crest.
  // Shared with focus mode through main.gtRipple(canvas, x, y, size): x, y in that canvas's CSS pixels.
  const TAU = Math.PI * 2, ripples = [];
  let ripRaf = 0;
  function rippleAt(cv, x, y, size) {
    if (reduceMotion) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const t0 = performance.now();
    for (let k = 0; k < 3; k++) ripples.push({ cv, x, y, R: size * (1 - k * 0.18), t0: t0 + k * 110, dpr, wob: [Math.random() * TAU, Math.random() * TAU] });
    if (!ripRaf) ripRaf = requestAnimationFrame(drawRipples);
  }
  main.gtRipple = rippleAt;
  function drawRipples(now) {
    ripRaf = 0;
    const cvs = new Set(ripples.map((r) => r.cv));
    cvs.forEach((cv) => cv.getContext("2d").clearRect(0, 0, cv.width, cv.height));
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i], u = (now - r.t0) / 1100;
      if (u >= 1) { ripples.splice(i, 1); continue; }
      if (u < 0) continue;
      const c = r.cv.getContext("2d"), e = 1 - Math.pow(1 - u, 3), rad = 4 + r.R * e, a = Math.pow(1 - u, 1.6);
      c.setTransform(r.dpr, 0, 0, r.dpr, 0, 0);
      const ring = (off) => {
        c.beginPath();
        for (let k = 0; k <= 60; k++) {
          const t = (k / 60) * TAU, rr = rad + off + rad * (0.03 * Math.sin(3 * t + r.wob[0]) + 0.02 * Math.sin(5 * t + r.wob[1]));
          k ? c.lineTo(r.x + Math.cos(t) * rr, r.y + Math.sin(t) * rr) : c.moveTo(r.x + Math.cos(t) * rr, r.y + Math.sin(t) * rr);
        }
      };
      // soft, broad bands (blurred with a shadow of their own colour) rather than crisp lines
      const lw = 3 + 7 * (1 - u);
      c.lineWidth = lw; c.shadowBlur = lw * 1.6 * r.dpr;
      ring(lw * 0.7); c.strokeStyle = c.shadowColor = `rgba(20,10,6,${(0.2 * a).toFixed(3)})`; c.stroke();
      ring(-lw * 0.35); c.strokeStyle = c.shadowColor = `rgba(255,236,210,${(0.3 * a).toFixed(3)})`; c.stroke();
      c.shadowBlur = 0;
      c.setTransform(1, 0, 0, 1, 0, 0);
    }
    if (ripples.length) ripRaf = requestAnimationFrame(drawRipples);
    else cvs.forEach((cv) => cv.getContext("2d").clearRect(0, 0, cv.width, cv.height));
  }

  // The sun flicks; the dark steps; anywhere else, the tap ripples the paint.
  const touch = main.parentNode.querySelector(".gt-touch");
  main.addEventListener("click", (e) => {
    const r = main.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (main.gtOverDisc(x, y)) userFlick();
    else if (main.gtOverDark(x, y)) main.gtStep();
    else rippleAt(touch, e.clientX - r.left, e.clientY - r.top, r.width * 0.32);
  });

  document.getElementById("gt-new").addEventListener("click", userFlick);
  // the seed copies a link straight to this variant (announced through a polite live region)
  const status = document.getElementById("gt-status");
  seedEl.addEventListener("click", async () => {
    const was = seedEl.textContent, url = location.href.split("#")[0] + "#seed=" + main.dataset.seed;
    let msg;
    try { await navigator.clipboard.writeText(url); msg = "link copied"; } catch (e) { msg = "copy failed"; }
    seedEl.textContent = msg; status.textContent = msg === "link copied" ? "Link to this variant copied" : "Couldn't copy the link";
    setTimeout(() => { if (seedEl.textContent === msg) seedEl.textContent = was; status.textContent = ""; }, 1400);
  });

  // Initial state: a linked seed is shown as-is; otherwise flick once when the painting first scrolls into view.
  const m = location.hash.match(/seed=(\d+)/);
  show(m ? +m[1] : randSeed());
  refill();
  // Once the reader acts (a tap, a button, Focus), the welcome flick is called off.
  if (!m && "IntersectionObserver" in window) {
    io = new IntersectionObserver((es) => {
      if (io && es.some((e) => e.isIntersecting) && pool.length >= POOL) { io.disconnect(); io = null; flick(); }
    }, { threshold: 0.6 });
    // wait until the pool is full before arming, so the first flick has frames to show
    (function arm() { if (!io) return; pool.length >= POOL ? io.observe(main) : setTimeout(arm, 200); })();
  }
})();
</script>

<!-- ===== focus mode for the Gottlieb widget (needs #gt-main with gtGeom/gtStep/gtOverDisc, #gt-new, #gt-focus-btn) =====
     Opening goes full screen where the browser allows it (a plain div, not <dialog>: the Fullscreen spec refuses dialogs, and Firefox enforces that).
     Opening dives into the painting's own sun while rows of its red are brushed over the screen; behind that paint the page goes
     full screen and the painting is re-rendered sharp and framed, then the view pulls back out of the sun as the paint is scraped
     off. Closing reverses it. Taps that don't change the variant ripple the paint (the ground no longer closes). In focus mode: sun tap = flick; tap on the lower (dark) half = straight to the next variant. Each new
     variant's ground is released as a ring from the sun, behind the frame; the landing ring is the new ground itself. -->
<style>

  .gt-focus-ground::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .3; mix-blend-mode: soft-light;

    display: flex; gap: 6px; align-items: center; transition: opacity .4s; opacity: .7; }

  .gt-focus.anim .gt-focus-bar, .gt-focus.anim .gt-focus-hint { opacity: 0; transition: none; }

  .gt-focus-hint { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: none;
    font: 13px/1.3 -apple-system, system-ui, sans-serif; color: rgba(241,227,214,.75); text-shadow: 0 1px 3px rgba(0,0,0,.6);

<script>
(function () {
  const main = document.getElementById("gt-main"), btn = document.getElementById("gt-focus-btn");

    '<canvas class="gt-focus-canvas" role="img"></canvas>' +
    '<canvas class="gt-touch" aria-hidden="true"></canvas>' +
    '<canvas class="gt-curtain"></canvas>' +
    '<div class="gt-focus-hint">Esc to close</div>' +
    '<div class="gt-focus-bar">' +
      '<button type="button" data-act="new">New perspective</button>' +
      '<button type="button" data-act="close">Close <span aria-hidden="true">✕</span></button>' +
    "</div>";

  const ground = stage.querySelector(".gt-focus-ground"), rip = stage.querySelector(".gt-ripple"), fc = stage.querySelector(".gt-focus-canvas");
  const touch = stage.querySelector(".gt-touch");

  const fsReq = stage.requestFullscreen ? "requestFullscreen" : stage.webkitRequestFullscreen ? "webkitRequestFullscreen" : null;
  const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsExit = () => (document.exitFullscreen || document.webkitExitFullscreen).call(document);

  let closeAfterOpen = false, skips = 0;
  let state = "closed", target = null, hiresTimer = 0, idleTimer = 0, recede = [], wentFS = false;
  const seed = () => +(main.dataset.seed || 0);
  const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  function fit() {
    const vw = stage.clientWidth || root.clientWidth, vh = stage.clientHeight || window.innerHeight, pad = Math.max(22, Math.min(vw, vh) * 0.055);
    let h = Math.min(vh - 2 * pad, (vw - 2 * pad) * 2), w = h / 2;
    // on narrow screens the bottom-right buttons would sit over the painting: keep clear of them, top and bottom alike
    const bh = bar.offsetHeight + 22, bl = vw - 14 - bar.offsetWidth - 8;
    if (bar.offsetHeight && (vw + w) / 2 > bl && bh > pad) { h = Math.min(vh - 2 * bh, (vw - 2 * pad) * 2); w = h / 2; }

  }

    const g = main.gtGeom && main.gtGeom();
    const red = g ? g.red : { x: 0.53, y: 0.25, rx: 0.245 };
    return { x: t.left + red.x * t.width, y: t.top + red.y * t.height, r: red.rx * t.width };

  const mctx = main.getContext("2d", { willReadFrequently: true });
  function avgAt(x, y, s) {
    const d = mctx.getImageData(Math.round(x - s / 2), Math.round(y - s / 2), s, s).data, c = [0, 0, 0], n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { c[0] += d[i]; c[1] += d[i + 1]; c[2] += d[i + 2]; }
    return [c[0] / n, c[1] / n, c[2] / n];

  function edgeColor() {
    const W = main.width, H = main.height, y0 = Math.round(H * 0.08), h = Math.round(H * 0.4);
    const ex = Math.round(W * 0.05), L = mctx.getImageData(ex, y0, 4, h).data, R = mctx.getImageData(W - ex - 4, y0, 4, h).data, px = [];
    for (let i = 0; i < L.length; i += 16) px.push([L[i], L[i + 1], L[i + 2]], [R[i], R[i + 1], R[i + 2]]);
    px.sort((a, b) => a[0] + a[1] + a[2] - (b[0] + b[1] + b[2]));
    const mid = px.slice(px.length >> 2, px.length - (px.length >> 2)), c = [0, 0, 0];
    mid.forEach((q) => { c[0] += q[0]; c[1] += q[1]; c[2] += q[2]; });

      await Promise.all([done([pull, gOut, ...recede]), scrapeOff(520)]);
    }
    stage.hidden = true;
    leftovers.forEach((a) => a.cancel());
    ground.style.opacity = 1; stage.getAnimations && stage.getAnimations().forEach((a) => a.cancel());
    curtain.getAnimations().forEach((a) => a.cancel()); cctx.clearRect(0, 0, curtain.width, curtain.height);
    recede.forEach((a) => a.cancel()); recede = [];
    pageEls().forEach((el) => (el.style.transformOrigin = ""));
    stage.classList.remove("anim", "idle");
    lock(false);
    btn.focus({ preventScroll: true });
    state = "closed";
  }

  // controls fade away while the pointer is still, gallery-style
  // (on touch screens they stay up: there's no hover to summon them, and on iPhone they're the only way out)
  const touchy = matchMedia("(pointer: coarse)");
  function poke() {
    stage.classList.remove("idle"); clearTimeout(idleTimer);
    if (!touchy.matches) idleTimer = setTimeout(() => state === "open" && stage.classList.add("idle"), 2500);
  }
  stage.addEventListener("pointermove", poke);
  stage.addEventListener("pointerdown", poke); // any tap brings the controls back (touch has no pointermove without a drag)
  document.addEventListener("keydown", (e) => {
    if (state === "closed") return;
    poke();
    if (e.key === "Escape") { e.preventDefault(); close(); }
  });
  // Esc in full screen is taken by the browser, which just exits full screen: treat that as closing focus mode
  // Leaving full screen during the opening (often the browser taking a second Esc) means "get me out": close once it lands.
  let sawFS = false;
  const onFsChange = () => {
    if (state === "opening") { if (fsOn()) sawFS = true; else if (sawFS) closeAfterOpen = true; return; }
    if (wentFS && !fsOn() && state === "open") close();
  };
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  // taps on the surrounding ground just ripple it (Close and Esc leave)
  const rippleHere = (e) => main.gtRipple && main.gtRipple(touch, e.clientX, e.clientY, (target ? target.width : 300) * 0.32);
  ground.addEventListener("click", (e) => { if (state === "open") { rippleHere(e); poke(); } });
  stage.addEventListener("click", () => { if (state === "opening") skip(); }); // tap to skip the opening
  const fracOf = (e) => { const r = fc.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  const overDark = (fxy) => main.gtOverDark(fxy[0], fxy[1]);
  fc.addEventListener("click", (e) => {
    if (state !== "open") return;
    const p = fracOf(e);
    if (main.gtOverDisc && main.gtOverDisc(p[0], p[1])) document.getElementById("gt-new").click(); // the sun spins
    else if (overDark(p) && main.gtStep) main.gtStep(); // the dark steps
    else { rippleHere(e); poke(); } // anywhere else just ripples
  });
  // mirror the widget's flick frames, releasing each frame's ground as a ring; sharpen once the rings settle
  main.addEventListener("gt:frame", () => { if (state === "open") { clearTimeout(hiresTimer); copyMain(); emitRing(false); } });
  main.addEventListener("gt:land", () => {
    if (state !== "open") return;
    copyMain();
    if (reduced.matches) { paintGround(target); hires(); } else emitRing(true); // the ground itself is repainted when the landing ring settles
  });
  bar.addEventListener("click", (e) => {
    const b = e.target.closest("button"), act = b && b.dataset.act;
    if (act === "close") close();
    else if (act === "new") document.getElementById("gt-new").click();
  });
  window.addEventListener("resize", () => {
    if (state !== "open") return;
    target = fit(); place(target); paintGround(target); hires();
  });
  btn.addEventListener("click", open);
})();
</script>
<!-- ===== end focus mode ===== -->
