<!-- Parameter explorer for the Gottlieb generator. Needs files/gottlieb/gottlieb.js (loaded by gottlieb.html earlier in the page).
     Sliders come from renderGottlieb.KNOBS; the red mark under each track ("closer to truth") is the range the variants above use.
     An untouched knob follows the seed; a moved one is pinned until Reset. -->
<style>
  .gx { margin: 1.5em 0; display: flex; gap: 22px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .gx-canvas { width: 230px; aspect-ratio: 1 / 2; display: block; box-shadow: 0 2px 12px rgba(0,0,0,.35); background: #50352a; flex: none; }
  .gx-panel { flex: 1 1 300px; max-width: 420px; font-size: .88em; }
  .gx-group { margin: 0 0 .9em; }
  .gx-group h4 { margin: 0 0 .3em; font-size: 1em; color: #3a2418; letter-spacing: .02em; }
  .gx-row { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; gap: .6em; margin: .15em 0; }
  .gx-row label { color: #5a4438; line-height: 1.15; }
  .gx-row.pinned label { color: #2a1a12; font-weight: 600; }
  .gx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .gx-row:not(.pinned) .gx-sr { display: none; }
  .gx input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  .gx input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #e6d8cc; }
  .gx input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #e6d8cc; }
  /* the variants' range, under the track where the thumb can't hide it; thumb centres run from 8px to (width - 8px) */
  .gx-trk { position: relative; padding-bottom: 6px; }
  .gx-band { position: absolute; top: 22px; height: 4px; border-radius: 2px; background: #b2422a; min-width: 10px; transform: translateX(-50%); }
  .gx input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: #f6efe9; border: 2px solid #3a2418; }
  .gx input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #f6efe9; border: 2px solid #3a2418; }
  .gx input[type=range]:focus-visible { outline: 2px solid #b2422a; outline-offset: 2px; }
  .gx-buttons { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; margin-top: .4em; }
  /* same pills as the widget's buttons above */
  .gx-buttons button { font: 500 14px/1 -apple-system, system-ui, sans-serif; letter-spacing: .02em; display: inline-flex; align-items: center; gap: .55em;
    padding: .62em 1.15em; border-radius: 999px; cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s;
    border: 1px solid #3a2418; background: transparent; color: #3a2418; }
  .gx-buttons button:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(58,36,24,.18); }
  .gx-buttons button:active { transform: translateY(0); box-shadow: none; }
  .gx-buttons button:focus-visible { outline: 2px solid #b2422a; outline-offset: 2px; }
  .gx-buttons button.primary { background: #3a2418; color: #f4e6d8; }
  .gx-buttons button.primary:hover { background: #4a2e1f; }
  .gx-sun { width: .95em; height: .95em; border-radius: 50%; background: #a9322a; box-shadow: 0 0 0 2px #ecd2b4; flex: none; }
  @media (prefers-reduced-motion: reduce) { .gx-buttons button, .gx-buttons button:hover { transition: none; transform: none; } }
  .gx-key { color: #7a6458; font-size: .92em; margin: .2em 0 .8em; }
  /* phones: painting stays beside the sliders (and pinned while they scroll), labels above each slider */
  @media (max-width: 600px) {
    .gx { flex-wrap: nowrap; gap: 12px; }
    .gx-canvas { width: 36%; min-width: 110px; position: sticky; top: 12px; }
    .gx-row { grid-template-columns: 1fr; gap: 0; margin: .1em 0 .35em; }
  }
  .gx-key i { display: inline-block; width: 1.6em; height: 4px; border-radius: 2px; background: #b2422a; vertical-align: middle; margin-right: .3em; }
</style>
<div class="gx" id="gx">
  <canvas class="gx-canvas" id="gx-canvas" width="600" height="1200" role="img" aria-label="A painting generated from the settings beside it"></canvas>
  <div class="gx-panel">
    <div class="gx-key"><i></i>closer to truth</div>
    <div id="gx-knobs"></div>
    <div class="gx-buttons">
      <button type="button" class="primary" id="gx-seed" aria-label="New perspective (explorer)"><span class="gx-sun" aria-hidden="true"></span>New perspective</button>
      <button type="button" id="gx-wild">Surprise me</button>
      <button type="button" id="gx-reset">Reset</button>
    </div>
  </div>
</div>
<script>
(function () {
  if (!window.renderGottlieb || !renderGottlieb.KNOBS) return;
  const KN = renderGottlieb.KNOBS, cv = document.getElementById("gx-canvas"), box = document.getElementById("gx-knobs");
  const GROUPS = { over: "Over: the red sun", under: "Under: the dark mass", ground: "Ground" };
  let seed = 1 + Math.floor(Math.random() * 1e6), pinned = {}, own = {}, inputs = {};
  // sliders run left-to-right in the direction of their label (e.g. "Height of the sun": right = higher = smaller y)
  const toSlider = (k, v) => (k.flip ? k.min + k.max - v : v);
  const fromSlider = (k, s) => (k.flip ? k.min + k.max - s : s);
  const pct = (k, v) => (100 * (toSlider(k, v) - k.min)) / (k.max - k.min);

  // What a screen reader hears: the real value (not the flipped slider position) and whether it's in the variants' range.
  function speak(o, v) {
    const lo = Math.min(o.k.vmin, o.k.vmax), hi = Math.max(o.k.vmin, o.k.vmax), tol = (o.k.max - o.k.min) * 0.01;
    o.inp.setAttribute("aria-valuetext", `${(+v).toFixed(2)}${v >= lo - tol && v <= hi + tol ? ", closer to truth" : ""}`);
  }
  for (const g of Object.keys(GROUPS)) {
    const sec = document.createElement("div"); sec.className = "gx-group";
    sec.innerHTML = `<h4>${GROUPS[g]}</h4>`;
    for (const k of KN.filter((k) => k.group === g)) {
      const row = document.createElement("div"), id = "gx-" + k.key;
      row.className = "gx-row";
      row.innerHTML = `<label for="${id}">${k.label}<span class="gx-sr"> (changed)</span></label><div class="gx-trk"><input type="range" id="${id}" min="${k.min}" max="${k.max}" step="${(k.max - k.min) / 400}"><span class="gx-band" aria-hidden="true"></span></div>`;
      const inp = row.querySelector("input");
      let a = pct(k, k.vmin), b = pct(k, k.vmax);
      if (a > b) [a, b] = [b, a];
      // centred on the range; at least 10px wide, so knobs the variants never move still get a visible mark
      const band = row.querySelector(".gx-band");
      band.style.left = `calc(8px + (100% - 16px) * ${(a + b) / 200})`;
      band.style.width = `calc((100% - 16px) * ${(b - a) / 100})`;
      inp.addEventListener("input", () => { pinned[k.key] = fromSlider(k, +inp.value); row.classList.add("pinned"); speak(inputs[k.key], pinned[k.key]); draw(true); });
      inp.addEventListener("change", () => draw(false));
      inputs[k.key] = { inp, row, k };
      sec.appendChild(row);
    }
    box.appendChild(sec);
  }

  // While dragging, render at half size and at most once per frame; full size when the slider is let go. (Half size saves
  // less than you'd hope: about 90 ms against 130 ms on a laptop, so dragging updates about ten times a second.)
  const small = document.createElement("canvas"); small.width = 300; small.height = 600;
  let raf = 0, wantSmall = false;
  function draw(fast) {
    wantSmall = fast;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const c = wantSmall ? small : cv;
      const g = renderGottlieb(c, seed, pinned);
      if (c === small) cv.getContext("2d").drawImage(small, 0, 0, cv.width, cv.height);
      own = g.knobs;
      for (const key in inputs) if (!(key in pinned)) { inputs[key].inp.value = toSlider(inputs[key].k, own[key]); speak(inputs[key], own[key]); }
    });
  }
  function reset() { pinned = {}; for (const key in inputs) inputs[key].row.classList.remove("pinned"); draw(false); }
  document.getElementById("gx-reset").addEventListener("click", reset);
  document.getElementById("gx-seed").addEventListener("click", () => { seed = 1 + Math.floor(Math.random() * 1e6); draw(false); });
  document.getElementById("gx-wild").addEventListener("click", () => {
    for (const key in inputs) {
      const { inp, row, k } = inputs[key];
      // mostly stay near the variants' range, sometimes go far outside it
      const v = Math.random() < 0.5 ? k.vmin + Math.random() * (k.vmax - k.vmin) : k.min + Math.random() * (k.max - k.min);
      pinned[key] = v; inp.value = toSlider(k, v); row.classList.add("pinned"); speak(inputs[key], v);
    }
    seed = 1 + Math.floor(Math.random() * 1e6);
    draw(false);
  });

  // render once the explorer is near the viewport, not on page load
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); draw(false); } }, { rootMargin: "300px" });
    io.observe(cv);
  } else draw(false);
})();
</script>
